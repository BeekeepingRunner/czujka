# Runs the whole app locally: docker compose up --build, then open http://localhost:8080
name: czujka

services:
  db:
    image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    environment:
      POSTGRES_DB: czujka
      POSTGRES_USER: czujka
      POSTGRES_PASSWORD: czujka
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # Over TCP (-h): while a new volume is initialised, PostgreSQL runs a temporary server that listens only on the
      # Unix socket. Without -h the check would pass against that one, before the backend can connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U czujka -d czujka"]
      interval: 5s
      retries: 10
      # Check every second while the database starts, so the backend can start sooner
      start_period: 30s
      start_interval: 1s

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/czujka
      DB_USER: czujka
      DB_PASSWORD: czujka
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
