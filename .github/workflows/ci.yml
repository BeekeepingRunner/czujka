name: CI

# Changes that only touch the ignored paths cannot affect the build, so they run no CI. .editorconfig and
# .gitattributes are not ignored on purpose: Prettier reads .editorconfig, and .gitattributes sets the line
# endings of files such as gradlew and nginx.conf. If CI ever becomes a required status check, replace this
# with a job-level change filter, because a skipped workflow leaves a required check pending.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Fails if gradle-wrapper.jar is not an official Gradle release (MIT, no caching component)
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          # Caches ~/.gradle (dependencies + wrapper) with the open-source actions/cache
          cache: gradle
      # Testcontainers uses the Docker engine preinstalled on GitHub runners
      - run: ./gradlew build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # The docker job runs in parallel, and its smoke test is pointless once a unit-test job fails. This job then cancels
  # the run. It waits for both unit-test jobs, so their results are never hidden; only the docker job is still
  # running by then. (GitHub cannot cancel a single job, only the whole run.)
  cancel-smoke-test:
    needs: [backend, frontend]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # Builds the images, starts the whole stack and runs the Playwright smoke test against it.
  # Runs in parallel with the other jobs (no `needs`) to keep CI short; the repo is public, so minutes are free.
  docker:
    runs-on: ubuntu-latest
    # Normally about 2 minutes; fail fast instead of GitHub's 6-hour default if something hangs
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Start the database in the background while the app images build
      - name: Start the database
        run: nohup docker compose up --detach db > /tmp/db.log 2>&1 &
      # Builds both images with their layers cached in the GitHub Actions cache. When the Gradle or npm
      # dependencies did not change, their download steps come from the cache. It uses Docker's own builder (no
      # setup-buildx-action): with the containerd image store it can use the GitHub Actions cache, and the images
      # land in Docker directly instead of being exported and loaded. Only main writes the cache; pull requests
      # read it, which saves the upload on every PR run.
      - name: Build the images
        uses: docker/bake-action@v7
        with:
          source: .
          files: compose.yaml
          set: |
            backend.tags=czujka-backend
            backend.cache-from=type=gha,scope=backend
            frontend.tags=czujka-frontend
            frontend.cache-from=type=gha,scope=frontend
            ${{ github.ref == 'refs/heads/main' && 'backend.cache-to=type=gha,scope=backend,mode=max' || '' }}
            ${{ github.ref == 'refs/heads/main' && 'frontend.cache-to=type=gha,scope=frontend,mode=max' || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Read the Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Only the headless shell, and no --with-deps: the runner image already has Chromium's system libraries,
      # and apt mirrors are slow or unreachable from the runners at times. A no-op when the cache hits.
      - run: npx playwright install --only-shell chromium
        working-directory: frontend
      - run: docker compose up --no-build --detach --wait
      # The backend has no healthcheck: wait until it returns the mock events (ingestion runs at startup)
      - name: Wait for events from the backend
        run: |
          for i in $(seq 240); do
            if curl -fsS http://localhost:8080/api/events | jq -e 'length > 0' > /dev/null 2>&1; then exit 0; fi
            sleep 0.5
          done
          echo "The backend returned no events within 2 minutes"
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
      - if: failure()
        run: docker compose logs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
      - if: always()
        run: docker compose down --volumes
