version: 2
# Every ecosystem waits 5 days after a release before proposing it (cooldown). A hijacked maintainer account
# usually gets its malicious release noticed and pulled within that time. Security updates for known
# vulnerabilities are not delayed. See docs/adr/0006-dependency-supply-chain.md.
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tracks the Node runtime; bumped by hand together with it (LTS only)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    ignore:
      # Odd Node majors are never LTS; bump to the next even (LTS) major by hand
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  # The PostGIS image in compose.yaml (pinned by digest, like the Dockerfile base images)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
