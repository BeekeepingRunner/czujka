version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tracks the Node runtime; bumped by hand together with it (LTS only)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # Odd Node majors are never LTS; bump to the next even (LTS) major by hand
      - dependency-name: node
        update-types: ["version-update:semver-major"]
